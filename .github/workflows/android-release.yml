name: VELORA Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Release version name"
        required: true
        default: "0.1.0"
        type: string
      version_code:
        description: "Android version code (increase for every release)"
        required: true
        default: "6"
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate inputs and signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::A required Android signing secret is missing."
              exit 1
            fi
          done
          [[ "$VERSION_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || {
            echo "::error::Version name may contain only letters, numbers, dots, underscores, and hyphens."
            exit 1
          }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "::error::Version code must be a positive integer."
            exit 1
          }
          mkdir -p "$RUNNER_TEMP/velora-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/velora-signing/release.jks"
          test -s "$RUNNER_TEMP/velora-signing/release.jks"

      - name: Set Android version for this build
        working-directory: android/app
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          path = Path("build.gradle.kts")
          source = path.read_text()
          source, code_count = re.subn(
              r"(?m)^([ \\t]*)versionCode[ \\t]*=[ \\t]*[0-9]+[ \\t]*$",
              lambda match: f"{match.group(1)}versionCode = {os.environ['VERSION_CODE']}",
              source,
          )
          source, name_count = re.subn(
              r'(?m)^([ \\t]*)versionName[ \\t]*=[ \\t]*"[^"]+"[ \\t]*
          if code_count != 1 or name_count != 1:
              raise SystemExit("Expected versionCode/versionName declarations were not found exactly once; refusing to build.")
          path.write_text(source)
          PY

      - name: Run unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Align and sign APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/velora-signing/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          mkdir -p release
          ALIGNED="$RUNNER_TEMP/velora-aligned.apk"
          SIGNED="release/VELORA_NEXUS_${VERSION_NAME}.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          sha256sum "$SIGNED" > "release/VELORA_NEXUS_${VERSION_NAME}.sha256"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: VELORA_NEXUS_${{ inputs.version_name }}_SIGNED
          path: |
            android/release/VELORA_NEXUS_${{ inputs.version_name }}.apk
            android/release/VELORA_NEXUS_${{ inputs.version_name }}.sha256
          if-no-files-found: error
          retention-days: 90
,
              lambda match: f'{match.group(1)}versionName = "{os.environ["VERSION_NAME"]}"',
              source,
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit("Expected versionCode/versionName declarations were not found exactly once; refusing to build.")
          path.write_text(source)
          PY

      - name: Run unit tests
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest

      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Align and sign APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/velora-signing/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS/zipalign"
          test -x "$BUILD_TOOLS/apksigner"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          mkdir -p release
          ALIGNED="$RUNNER_TEMP/velora-aligned.apk"
          SIGNED="release/VELORA_NEXUS_${VERSION_NAME}.apk"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE_PATH" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED" "$ALIGNED"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$SIGNED"
          sha256sum "$SIGNED" > "release/VELORA_NEXUS_${VERSION_NAME}.sha256"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: VELORA_NEXUS_${{ inputs.version_name }}_SIGNED
          path: |
            android/release/VELORA_NEXUS_${{ inputs.version_name }}.apk
            android/release/VELORA_NEXUS_${{ inputs.version_name }}.sha256
          if-no-files-found: error
          retention-days: 90
