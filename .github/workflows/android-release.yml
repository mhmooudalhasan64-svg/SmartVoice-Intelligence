name: VELORA Signed Android Release

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Public version name"
        required: true
        default: "0.1.0"
        type: string
      version_code:
        description: "Android version code (must increase for every release)"
        required: true
        default: "6"
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              case "$name" in
                KEYSTORE_BASE64) secret_name="ANDROID_KEYSTORE_BASE64" ;;
                KEYSTORE_PASSWORD) secret_name="ANDROID_KEYSTORE_PASSWORD" ;;
                KEY_ALIAS) secret_name="ANDROID_KEY_ALIAS" ;;
                KEY_PASSWORD) secret_name="ANDROID_KEY_PASSWORD" ;;
              esac
              echo "::error::Missing GitHub Actions secret: $secret_name"
              exit 1
            fi
          done
          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]] || [ "$VERSION_CODE" -lt 1 ]; then
            echo "::error::VERSION_CODE must be a positive integer"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/velora-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/velora-signing/release.jks"
          test -s "$RUNNER_TEMP/velora-signing/release.jks"

      - name: Build signed release APK
        working-directory: android
        shell: bash
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/velora-signing/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          gradle --no-daemon assembleRelease \
            -PVERSION_NAME="$VERSION_NAME" \
            -PVERSION_CODE="$VERSION_CODE" \
            -PANDROID_KEYSTORE_PATH="$KEYSTORE_PATH" \
            -PANDROID_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD" \
            -PANDROID_KEY_ALIAS="$KEY_ALIAS" \
            -PANDROID_KEY_PASSWORD="$KEY_PASSWORD"
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/VELORA_NEXUS_${VERSION_NAME}.apk"
          sha256sum "release/VELORA_NEXUS_${VERSION_NAME}.apk" > "release/VELORA_NEXUS_${VERSION_NAME}.sha256"

      - name: Verify APK signature
        working-directory: android
        run: |
          APK="release/VELORA_NEXUS_${{ inputs.version_name }}.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: VELORA_NEXUS_${{ inputs.version_name }}_SIGNED
          path: |
            android/release/VELORA_NEXUS_${{ inputs.version_name }}.apk
            android/release/VELORA_NEXUS_${{ inputs.version_name }}.sha256
          if-no-files-found: error
          retention-days: 90
