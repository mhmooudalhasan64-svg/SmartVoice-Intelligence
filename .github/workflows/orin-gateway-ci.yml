name: ORIN Gateway CI

on:
  push:
    paths:
      - "orin-gateway/**"
      - ".github/workflows/orin-gateway-ci.yml"
  pull_request:
    paths:
      - "orin-gateway/**"
      - ".github/workflows/orin-gateway-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: orin-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run validation tests
        run: npm test
